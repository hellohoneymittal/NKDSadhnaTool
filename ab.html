<div class="popup" id="sundayContainer">
  <div class="popup-content scrollable-content">
    <h2>Please fill below things!</h2>
    <div id="kartik-radio-buttons" class="radio-container-scroll">
      <!-- Question 1 -->
      <div class="radio-container">
        <div class="radio-heading">
          <label for="sun" class="required"
            >क्या आप कल संकीर्तन में जाएंगे?</label
          >
        </div>
        <div class="radio-content">
          <div class="options">
            <input
              type="radio"
              id="sun-yes"
              name="sun"
              value="हाँ"
              class="custom-radio required"
            />
            <label for="sun-yes" class="custom-label">हाँ</label>
          </div>
          <div class="options">
            <input
              type="radio"
              id="sun-no"
              name="sun"
              value="नहीं"
              class="custom-radio"
            />
            <label for="night9-no" class="custom-label">नहीं</label>
          </div>
        </div>
      </div>

      <button class="green" onclick="showKartikRadioResult()">Next</button>
    </div>
  </div>
</div>
